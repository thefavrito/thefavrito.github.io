<svg xmlns='http://www.w3.org/2000/svg' width='360' height='956' viewBox='0 0 360 956'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>3 of 14 ports off normal for import</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>containers in Sep 2026: Mundra Red;</text><text x='0' y='66' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>Pipavav and Kochi Amber</text><text x='0' y='82' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Hours an import container sits in the port. The bar is</text><text x='0' y='98' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>the smaller of two rises, against the same month last</text><text x='0' y='114' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>year and against the port's median for the 12 months</text><text x='0' y='130' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>before; the port is rated on it. Amber at 20%, Red at</text><text x='0' y='146' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>50%. Logistics Data Bank, monthly.</text><rect x='0' y='157' width='10' height='10' fill='#1F8A4C'/><text x='14' y='166' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='0' y='174' width='10' height='10' fill='#B7791F'/><text x='14' y='183' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='0' y='191' width='10' height='10' fill='#B83A2E'/><text x='14' y='200' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='227.1' y1='224' x2='227.1' y2='930' stroke='#B7791F' stroke-dasharray='3 3'/><text x='227.1' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber +20%</text><line x1='309.2' y1='224' x2='309.2' y2='930' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='309.2' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red +50%</text><line x1='172.4' y1='224' x2='172.4' y2='930' stroke='#1B2420'/><text x='172.4' y='944' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>normal</text><text x='0' y='244' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Nhava Sheva</text><text x='0' y='259' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>34 h (-21% on last year, +7% on normal)</text><rect x='114.7' y='266' width='57.7' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='294' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Mundra</text><text x='0' y='309' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>51 h (+60% on last year, +68% on normal)</text><rect x='172.4' y='316' width='164.6' height='12' fill='#B83A2E' opacity='.85'/><text x='0' y='344' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Chennai</text><text x='0' y='359' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>37 h (-12% on last year, -5% on normal)</text><rect x='138.7' y='366' width='33.6' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='394' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Kolkata</text><text x='0' y='409' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>39 h (-11% on last year, -15% on normal)</text><rect x='132.1' y='416' width='40.2' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='444' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Tuticorin</text><text x='0' y='459' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>28 h (+35% on last year, +13% on normal)</text><rect x='172.4' y='466' width='36.1' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='494' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Hazira</text><text x='0' y='509' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>22 h (-56% on last year, -27% on normal)</text><rect x='19.1' y='516' width='153.3' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='544' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Kochi</text><text x='0' y='559' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>54 h (+68% on last year, +50% on normal)</text><rect x='172.4' y='566' width='135.5' height='12' fill='#B7791F' opacity='.85'/><text 
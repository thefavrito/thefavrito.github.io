00' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Kandla</text><text x='0' y='809' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>30 h (-48% on last year, -5% on normal)</text><rect x='41.5' y='816' width='130.9' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='844' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>New Mangalore</text><text x='0' y='859' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>44 h (+1% on last year, 0% on normal)</text><rect x='171.7' y='866' width='2.0' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='894' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Gangavaram</text><text x='0' y='909' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>32 h (-30% on last year, -33% on normal)</text><rect x='80.9' y='916' width='91.4' height='12' fill='#1F8A4C' opacity='.85'/></svg>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='508' viewBox='0 0 960 508'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>3 of 14 ports off normal for import containers in Sep 2026: Mundra Red; Pipavav and Kochi Amber</text><text x='0' y='38' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Hours an import container sits in the port. The bar is the smaller of two rises, against the same month last year and against the port's median for</text><text x='0' y='54' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>the 12 months before; the port is rated on it. Amber at 20%, Red at 50%. Logistics Data Bank, monthly.</text><rect x='0' y='65' width='10' height='10' fill='#1F8A4C'/><text x='14' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='156.2' y='65' width='10' height='10' fill='#B7791F'/><text x='170.2' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='293.77' y='65' width='10' height='10' fill='#B83A2E'/><text x='307.77' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='422.4' y1='98' x2='422.4' y2='482' stroke='#B7791F' stroke-dasharray='3 3'/><text x='422.4' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber +20%</text><line x1='510.1' y1='98' x2='510.1' y2='482' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='510.1' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red +50%</text><line x1='364.0' y1='98' x2='364.0' y2='482' stroke='#1B2420'/><text x='364.0' y='496' text-anchor='middle' font-famil
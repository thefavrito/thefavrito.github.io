<svg xmlns='http://www.w3.org/2000/svg' width='960' height='265' viewBox='0 0 960 265'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>2 of 5 sea routes off normal, 28 days to 22 Nov: Strait of Hormuz Red; Bab el-Mandeb Amber</text><text x='0' y='38' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Container ships a day, 28-day average, against the same 28 days last year; left of the line is worse. Amber at 20% fewer, Red at 50% fewer. The Cape</text><text x='0' y='54' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>of Good Hope is drawn the other way round, since more ships there means ships avoiding the Red Sea. IMF PortWatch.</text><rect x='0' y='65' width='10' height='10' fill='#1F8A4C'/><text x='14' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='156.2' y='65' width='10' height='10' fill='#B7791F'/><text x='170.2' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='293.77' y='65' width='10' height='10' fill='#B83A2E'/><text x='307.77' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='385.9' y1='98' x2='385.9' y2='239' stroke='#B7791F' stroke-dasharray='3 3'/><text x='385.9' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber -20%</text><line x1='314.2' y1='98' x2='314.2' y2='239' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='314.2' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red -50%</text><line x1='433.6' y1='98' x2='433.6' y2='239' stroke='#1B2420'/><text x='433.6' y='253' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>last year</text><text x='170' y='121' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Strait of Hormuz</text><rect x='200.4' y='110' width='233.3' height='16' fill='#B83A2E' opacity='.85'/><text x='574' y='121' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>0 a day, last year 14 (-98%)</text><text x='170' y='148' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Bab el-Mandeb</text><rect x='382.4' y='137' width='51.2' height='16' fill='#B7791F' opacity='.85'/><text x='574' y='148' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>5 a day, last year 6 (-21%)</text><text x='170' y='175' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Suez Canal</text><rect x='433.6' y='164' width='106.0' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='175' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>14 a day, last year 10 (+44%)</text><text x='170' y='202' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Cape of Good Hope</text><rect x='433.6' y='191' width='81.6' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='202' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>12 a day, last year 19 (-34%: fewer here means fewer ships avoiding the Red Sea)</text><text x='170' y='229' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Malacca Strait</text><rect x='425.3' y='218' width='8.3' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='229' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>59 a day, last year 62 (-3%)</text></svg>
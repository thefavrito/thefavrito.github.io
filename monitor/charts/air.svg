<svg xmlns='http://www.w3.org/2000/svg' width='960' height='258' viewBox='0 0 960 258'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='20' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>International air cargo by airport, Sep 2026, tonnes</text><text x='0' y='40' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Airports Authority of India. In brackets: against the same month last year, then the two months before.</text><text x='182' y='69' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Delhi</text><rect x='190' y='57' width='390.0' height='16' fill='#0B6B4C' opacity='0.85'/><text x='586.0' y='69' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>78,027 t</tspan><tspan fill='#5E6B65'> (+27% on last year, +10% on the two months before)</tspan></text><text x='182' y='93' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Mumbai</text><rect x='190' y='81' width='275.2' height='16' fill='#0B6B4C' opacity='0.85'/><text x='471.2' y='93' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>55,064 t</tspan><tspan fill='#5E6B65'> (-4% on last year, -15% on the two months before)</tspan></text><text x='182' y='117' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Bengaluru</text><rect x='190' y='105' width='182.8' height='16' fill='#0B6B4C' opacity='0.85'/><text x='378.8' y='117' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>36,582 t</tspan><tspan fill='#5E6B65'> (+34% on last year, +3% on the two months before)</tspan></text><text x='182' y='141' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Chennai</text><rect x='190' y='129' width='173.7' height='16' fill='#0B6B4C' opacity='0.85'/><text x='369.7' y='141' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>34,761 t</tspan><tspan fill='#5E6B65'> (+29% on last year, +3% on the two months before)</tspan></text><text x='182' y='165' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Hyderabad</text><rect x='190' y='153' width='59.7' height='16' fill='#0B6B4C' opacity='0.85'/><text x='255.7' y='165' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>11,939 t</tspan><tspan fill='#5E6B65'> (+14% on last year, +1% on the two months before)</tspan></text><text x='182' y='189' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Ahmedabad</text><rect x='190' y='177' width='36.9' height='16' fill='#0B6B4C' opacity='0.85'/><text x='232.9' y='189' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>7,388 t</tspan><tspan fill='#5E6B65'> (+43% on last year, +12% on the two months before)</tspan></text><text x='182' y='213' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Kochi</text><rect x='190' y='201' width='26.7' height='16' fill='#0B6B4C' opacity='0.85'/><text x='222.7' y='213' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>5,350 t</tspan><tspan fill='#5E6B65'> (+18% on last year, -3% on the two months before)</tspan></text><text x='182' y='237' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420' text-anchor='end'>Kolkata</text><rect x='190' y='225' width='24.8' height='16' fill='#0B6B4C' opacity='0.85'/><text x='220.8' y='237' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'><tspan font-weight='700'>4,962 t</tspan><tspan fill='#5E6B65'> (+9% on last year, +6% on the two months before)</tspan></text></svg>
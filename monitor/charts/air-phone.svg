<svg xmlns='http://www.w3.org/2000/svg' width='360' height='548' viewBox='0 0 360 548'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>Not rated: international air cargo by</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>airport in Sep 2026, against last year</text><text x='0' y='60' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Tonnes, against the same month last year. There is no</text><text x='0' y='76' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>colour rule for air cargo yet, so the bars are grey.</text><text x='0' y='92' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Airports Authority of India, about five weeks late.</text><line x1='47.6' y1='116' x2='47.6' y2='522' stroke='#1B2420'/><text x='47.6' y='536' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>last year</text><text x='0' y='136' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Delhi</text><text x='0' y='151' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>78,027 t (+27%)</text><rect x='47.6' y='158' width='183.1' height='12' fill='#5E6B65' opacity='.85'/><text x='0' y='186' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Mumbai</text><text x='0' y='201' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>55,064 t (-4%)</text><rect x='19.1' y='208
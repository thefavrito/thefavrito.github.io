<svg xmlns='http://www.w3.org/2000/svg' width='360' height='520' viewBox='0 0 360 520'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>2 of 5 sea routes off normal, 28 days</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>to 22 Nov: Strait of Hormuz Red; Bab</text><text x='0' y='66' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>el-Mandeb Amber</text><text x='0' y='82' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Container ships a day, 28-day average, against the same</text><text x='0' y='98' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>28 days last year; left of the line is worse. Amber at</text><text x='0' y='114' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>20% fewer, Red at 50% fewer. The Cape of Good Hope is</text><text x='0' y='130' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>drawn the other way round, since more ships there means</text><text x='0' y='146' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>ships avoiding the Red Sea. IMF PortWatch.</text><rect x='0' y='157' width='10' height='10' fill='#1F8A4C'/><text x='14' y='166' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='0' y='174' width='10' height='10' fill='#B7791F'/><text x='14' y='183' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='0' y='191' width='10' height='10' fill='#B83A2E'/><text x='14' y='200' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='192.9' y1='224' x2='192.9' y2='494' stroke='#B7791F' stroke-dasharray='3 3'/><text x='192.9' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber -20%</text><line x1='125.7' y1='224' x2='125.7' y2='494' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='125.7' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red -50%</text><line x1='237.6' y1='224' x2='237.6' y2='494' stroke='#1B2420'/><text x='237.6' y='508' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>last year</text><text x='0' y='244' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Malacca Strait</text><text x='0' y='259' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>59 a day, last year 62 (-3%)</text><rect x='229.8' y='266' width='7.8' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='294' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Cape of Good Hope</text><text x='0' y='309' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>12 a day, last year 19 (-34%: fewer here means fewer</text><text x='0' y='323' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>ships avoiding the Red Sea)</text><rect x='237.6' y='330' width='76.4' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='358' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Strait of Hormuz</text><text x='0' y='373' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>0 a day, last year 14 (-98%)</text><rect x='19.1' y='380' width='218.5' height='12' fill='#B83A2E' opacity='.85'/><text x='0' y='408' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Suez Canal</text><text x='0' y='423' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>14 a day, last year 10 (+44%)</text><rect x='237.6' y='430' width='99.3' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='458' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Bab el-Mandeb</text><text x='0' y='473' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>5 a day, last year 6 (-21%)</text><rect x='189.7' y='480' width='47.9' height='12' fill='#B7791F' opacity='.85'/></svg>
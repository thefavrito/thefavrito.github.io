<svg xmlns='http://www.w3.org/2000/svg' width='960' height='265' viewBox='0 0 960 265'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>All 5 highway corridors within normal in Aug 2026</text><text x='0' y='38' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Heavy trucks a day at the toll plazas on each corridor, against the same month last year. Amber at 20% fewer, Red at 50% fewer. IHMCL FASTag counts,</text><text x='0' y='54' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>about three months late.</text><rect x='0' y='65' width='10' height='10' fill='#1F8A4C'/><text x='14' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='156.2' y='65' width='10' height='10' fill='#B7791F'/><text x='170.2' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='293.77' y='65' width='10' height='10' fill='#B83A2E'/><text x='307.77' y='74' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='379.0' y1='98' x2='379.0' y2='239' stroke='#B7791F' stroke-dasharray='3 3'/><text x='379.0' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber -20%</text><line x1='200.4' y1='98' x2='200.4' y2='239' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='200.4' y='94' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red -50%</text><line x1='498.0' y1='98' x2='498.0' y2='239' stroke='#1B2420'/><text x='498.0' y='253' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>last year</text><text x='170' y='121' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Delhi–Mumbai</text><rect x='403.1' y='110' width='94.9' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='121' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>about 6,400 heavy trucks a day a plaza</text><text x='170' y='148' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Mumbai–Bengaluru</text><rect x='498.0' y='137' width='41.6' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='148' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>about 4,000 heavy trucks a day a plaza</text><text x='170' y='175' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Delhi–Kolkata</text><rect x='498.0' y='164' width='36.4' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='175' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>about 5,600 heavy trucks a day a plaza</text><text x='170' y='202' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Chennai–Bengaluru</text><rect x='475.8' y='191' width='22.2' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='202' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>about 3,700 heavy trucks a day a plaza</text><text x='170' y='229' text-anchor='end' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>Ahmedabad–Kandla/Mundra</text><rect x='496.6' y='218' width='2.0' height='16' fill='#1F8A4C' opacity='.85'/><text x='574' y='229' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1B2420'>about 14,300 heavy trucks a day a plaza</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 370" width="958" height="370" role="img" aria-label="Parcels each network carried in FY26, with the range the sources allow"><style>.c-t{font:700 16px "Archivo","Arial Narrow",Helvetica,Arial,sans-serif;font-stretch:85%;fill:#13201B}.c-s,.c-n{font:400 12px "IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#5A6A63}.c-n{font-size:11px}.c-h{font:600 10px "IBM Plex Mono",Menlo,Consolas,monospace;fill:#5A6A63;letter-spacing:.04em;text-transform:uppercase}.c-l{font:500 12px "IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#13201B}.c-l.b{font-weight:700}.c-u{font:400 10.5px "IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#5A6A63}.c-v{font:400 11px "IBM Plex Mono",Menlo,Consolas,monospace;fill:#13201B;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}.c-b{font:400 11.5px "IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#13201B}.c-v.m{fill:#5A6A63}.c-v.b{font-weight:600}.c-x{font:400 10.5px "IBM Plex Mono",Menlo,Consolas,monospace;fill:#13201B}.c-i{font:500 11px "IBM Plex Mono",Menlo,Consolas,monospace}</style><rect width="958" height="370" fill="#FFFFFF"/><text class="c-t" x="16" y="30">Networks that publish a count carry about 56% of India&#x27;s parcels; the rest, mostly Amazon&#x27;s and Ekart&#x27;s, is what is left over</text><text class="c-s" x="16" y="50">Parcels each network carried in FY26, million, and its share of about 7.4 billion in all. Bar: the figure used here; thin line: the range the public sources</text><text class="c-s" x="16" y="66">allow. Most certain first.</text><text class="c-h" x="250.64000000000004" y="92">FY26 parcels, million</text><text class="c-h" x="16" y="110">Reported by the company</text><text class="c-l" x="16" y="130.0">Delhivery</text><rect x="250.64000000000004" y="120" width="105.9" height="12" fill="#0B6B4C"/><text class="c-v" x="362.6" y="130.0">1,054 (14%)</text><text class="c-l" x="16" y="150.0">Blue Dart</text><rect x="250.64000000000004" y="140" width="40.5" height="12" fill="#0B6B4C"/><text class="c-v" x="297.1" y="150.0">403 (5%)</text><text class="c-l" x="16" y="170.0">India Post</text><rect x="250.64000000000004" y="160" width="7.5" height="12" fill="#0B6B4C"/><text class="c-v" x="264.2" y="170.0">75 (1%)</text><text class="c-h" x="16" y="196">Worked out from reported figures</text><text class="c-l" x="16" y="216.0">Valmo (Meesho)</text><rect x="250.64000000000004" y="206" width="139.7" height="12" fill="#0B6B4C"/><line x1="381.3" x2="411.5" y1="212.0" y2="212.0" stroke="#13201B" stroke-width="1"/><line x1="381.3" x2="381.3" y1="208.0" y2="216.0" stroke="#13201B" stroke-width="1"/><line x1="411.5" x2="411.5" y1="208.0" y2="216.0" stroke="#13201B" stroke-width="1"/><text class="c-v" x="417.5" y="216.0">1,390 (19%; range 1,300–1,600)</text><text class="c-l" x="16" y="236.0">Shadowfax</text><rect x="250.64000000000004" y="226" width="58.3" height="12" fill="#0B6B4C"/><line x1="306.9" x2="310.9" y1="232.0" y2="232.0" stroke="#13201B" stroke-width="1"/><line x1="306.9" x2="306.9" y1="228.0" y2="236.0" stroke="#13201B" stroke-width="1"/><line x1="310.9" x2="310.9" y1="228.0" y2="236.0" stroke="#13201B" stroke-width="1"/><text class="c-v" x="316.9" y="236.0">580 (8%; range 560–600)</text><text class="c-h" x="16" y="262">Estimates from press reports or undated company claims</text><text class="c-l" x="16" y="282.0">Xpressbees</text><rect x="250.64000000000004" y="272" width="44.2" height="12" fill="#0B6B4C"/><line x1="285.8" x2="300.9" y1="278.0" y2="278.0" stroke="#13201B" stroke-width="1"/><line x1="285.8" x2="285.8" y1="274.0" y2="282.0" stroke="#13201B" stroke-width="1"/><line x1="300.9" x2="300.9" y1="274.0" y2="282.0" stroke="#13201B" stroke-width="1"/><text class="c-v" x="306.9" y="282.0">440 (6%; range 350–500)</text><text class="c-l" x="16" y="302.0">DTDC</text><rect x="250.64000000000004" y="292" width="17.1" height="12" fill="#0B6B4C"/><line x1="265.7" x2="269.7" y1="298.0" y2="298.0" stroke="#13201B" stroke-width="1"/><line x1="265.7" x2="265.7" y1="294.0" y2="302.0" stroke="#13201B" stroke-width="1"/><line x1="269.7" x2="269.7" y1="294.0" y2="302.0" stroke="#13201B" stroke-width="1"/><text class="c-v" x="275.7" y="302.0">170 (2%; range 150–190)</text><text class="c-h" x="16" y="328">Not published: what is left of the market</text><text class="c-l" x="16" y="348.0">Amazon, Ekart and smaller carriers</text><rect x="250.64000000000004" y="338" width="329.6" height="12" fill="#7D8B85"/><line x1="418.4" x2="752.0" y1="344.0" y2="344.0" stroke="#13201B" stroke-width="1"/><line x1="418.4" x2="418.4" y1="340.0" y2="348.0" stroke="#13201B" stroke-width="1"/><line x1="752.0" x2="752.0" y1="340.0" y2="348.0" stroke="#13201B" stroke-width="1"/><text class="c-v" x="758.0" y="348.0">3,279 (44%; range 1,669–4,988)</text></svg>

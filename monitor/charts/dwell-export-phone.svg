<svg xmlns='http://www.w3.org/2000/svg' width='360' height='956' viewBox='0 0 360 956'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>3 of 14 ports off normal for export</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>containers in Sep 2026: Kandla Red;</text><text x='0' y='66' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>Ennore and Visakhapatnam Amber</text><text x='0' y='82' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Hours an export container sits in the port. The bar is</text><text x='0' y='98' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>the smaller of two rises, against the same month last</text><text x='0' y='114' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>year and against the port's median for the 12 months</text><text x='0' y='130' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>before; the port is rated on it. Amber at 20%, Red at</text><text x='0' y='146' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>50%. Logistics Data Bank, monthly.</text><rect x='0' y='157' width='10' height='10' fill='#1F8A4C'/><text x='14' y='166' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='0' y='174' width='10' height='10' fill='#B7791F'/><text x='14' y='183' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='0' y='191' width='10' height='10' fill='#B83A2E'/><text x='14' y='200' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='184.5' y1='224' x2='184.5' y2='930' stroke='#B7791F' stroke-dasharray='3 3'/><text x='184.5' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber +20%</text><line x1='298.1' y1='224' x2='298.1' y2='930' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='298.1' y='220' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red +50%</text><line x1='108.7' y1='224' x2='108.7' y2='930' stroke='#1B2420'/><text x='108.7' y='944' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>normal</text><text x='0' y='244' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Kandla</text><text x='0' y='259' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>131 h (+96% on last year, +60% on normal)</text><rect x='108.7' y='266' width='228.2' height='12' fill='#B83A2E' opacity='.85'/><text x='0' y='294' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Visakhapatnam</text><text x='0' y='309' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>137 h (+34% on last year, +46% on normal)</text><rect x='108.7' y='316' width='129.5' height='12' fill='#B7791F' opacity='.85'/><text x='0' y='344' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Ennore</text><text x='0' y='359' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>150 h (+28% on 
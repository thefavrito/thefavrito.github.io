<svg xmlns='http://www.w3.org/2000/svg' width='360' height='772' viewBox='0 0 360 772'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>4 of 10 overseas hubs off normal, 28</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>days to 20 Nov: Jebel Ali Red;</text><text x='0' y='66' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>Shanghai, Ningbo and Yantian Amber</text><text x='0' y='82' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Container ship calls a day at the transhipment and</text><text x='0' y='98' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>origin hubs behind India's trade, 28-day average,</text><text x='0' y='114' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>against the same 28 days last year; left of the line is</text><text x='0' y='130' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>worse. Amber at 20% fewer, Red at 50% fewer. Calls show</text><text x='0' y='146' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>a port slowing, not ships queuing outside it. IMF</text><text x='0' y='162' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>PortWatch.</text><rect x='0' y='173' width='10' height='10' fill='#1F8A4C'/><text x='14' y='182' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='0' y='190' width='10' height='10' fill='#B7791F'/><text x='14' y='199' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='0' y='207' width='10' height='10' fill='#B83A2E'/><text x='14' y='216' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='188.6' y1='240' x2='188.6' y2='746' stroke='#B7791F' stroke-dasharray='3 3'/><text x='188.6' y='236' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber -20%</text><line x1='113.1' y1='240' x2='113.1' y2='746' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='113.1' y='236' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B83A2E'>Red -50%</text><line x1='238.9' y1='240' x2='238.9' y2='746' stroke='#1B2420'/><text x='238.9' y='760' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5E6B65'>last year</text><text x='0' y='260' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Singapore</text><text x='0' y='275' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>34 a day, last year 39 (-13%)</text><rect x='206.9' y='282' width='31.9' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='310' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Shanghai</text><text x='0' y='325' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>28 a day, last year 38 (-25%)</text><rect x='176.0' y='332' width='62.9' height='12' fill='#B7791F' opacity='.85'/><text x='0' y='360' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Ningbo</text><text x='0' y='375' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>27 a day, last year 34 (-20%)</text><rect x='188.5' y='382' width='50.4' height='12' fill='#B7791F' opacity='.85'/><text x='0' y='410' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Busan</text><text x='0' y='425' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>28 a day, last year 32 (-13%)</text><rect x='205.0' y='432' width='33.8' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='460' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Port Klang</text><text x='0' y='475' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>19 a day, last year 21 (-13%)</text><rect x='207.2' y='482' width='31.7' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='510' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Jebel Ali</text><text x='0' y='525' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>2 a day, last year 14 (-87%)</text><rect x='19.1' y='532' width='219.8' height='12' fill='#B83A2E' opacity='.85'/><text x='0' y='560' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Yantian</text><text x='0' y='575' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>8 a day, last year 10 (-23%)</text><rect x='180.5' y='582' width='58.4' height='12' fill='#B7791F' opacity='.85'/><text x='0' y='610' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Colombo</text><text x='0' y='625' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>9 a day, last year 10 (-11%)</text><rect x='210.1' y='632' width='28.8' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='660' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Shekou</text><text x='0' y='675' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>7 a day, last year 9 (-17%)</text><rect x='196.1' y='682' width='42.8' height='12' fill='#1F8A4C' opacity='.85'/><text x='0' y='710' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#1B2420' stroke='#fff' stroke-width='4' paint-order='stroke'>Salalah</text><text x='0' y='725' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5E6B65' stroke='#fff' stroke-width='4' paint-order='stroke'>3 a day, last year 2 (+39%)</text><rect x='238.9' y='732' width='98.1' height='12' fill='#1F8A4C' opacity='.85'/></svg>
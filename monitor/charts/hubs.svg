<svg xmlns='http://www.w3.org/2000/svg' width='960' height='422' viewBox='0 0 960 422'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>4 of 10 overseas hubs off normal, 28 days to 20 Nov: Jebel Ali Red; Shanghai, Ningbo and Yantian</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>Amber</text><text x='0' y='60' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Container ship calls a day at the transhipment and origin hubs behind India's trade, 28-day average, against the same 28 days last year; left of the</text><text x='0' y='76' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>line is worse. Amber at 20% fewer, Red at 50% fewer. Calls show a port slowing, not ships queuing outside it. IMF PortWatch.</text><rect x='0' y='87' width='10' height='10' fill='#1F8A4C'/><text x='14' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='156.2' y='87' width='10' height='10' fill='#B7791F'/><text x='170.2' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='293.77' y='87' width='10' height='10' fill='#B83A2E'/><text x='307.77' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='381.3' y1='120' x2='381.3' y2='396' stroke='#B7791F' stroke-dasharray='3 3'/><text x='381.3' y='116' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber -20%</text><line x1='300.7' y1='120' x2='300.7' y2='396' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='300.7' y='116' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' fon
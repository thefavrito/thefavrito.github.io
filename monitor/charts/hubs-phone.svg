<svg xmlns='http://www.w3.org/2000/svg' width='360' height='1688' viewBox='0 0 360 1688'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>17 of 28 overseas ports off normal, 28</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>days to 20 Nov: Jebel Ali, Khalifa</text><text x='0' y='66' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#1B2420'>Port, Dammam, Jubail, Hamad, Shuwaikh,</text><text x='0' y='82' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Ship calls a day at the overseas ports behind India's</text><text x='0' y='98' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>trade, 28-day average, against the same 28 days last</text><text x='0' y='114' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>year; left of the line is worse. Container ships where</text><text x='0' y='130' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>a port averaged at least one a day last year, otherwise</text><text x='0' y='146' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>every kind of ship; ports with under one call a day are</text><text x='0' y='162' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>not rated and left off. Amber at 20% fewer, Red at 50%</text><text x='0' y='178' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>fewer. IMF PortWatch.</text><rect x='0' y='189' width='10' height='10' fill='#1F8A4C'/><text x='14' y='198' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='0' y='206' width='10' height='10' fill=
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='530' viewBox='0 0 960 530'><rect width='100%' height='100%' fill='#fff'/><text x='0' y='22' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>3 of 14 ports off normal for export containers in Sep 2026: Kandla Red; Ennore and Visakhapatnam</text><text x='0' y='44' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#1B2420'>Amber</text><text x='0' y='60' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>Hours an export container sits in the port. The bar is the smaller of two rises, against the same month last year and against the port's median for</text><text x='0' y='76' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='12' fill='#5E6B65'>the 12 months before; the port is rated on it. Amber at 20%, Red at 50%. Logistics Data Bank, monthly.</text><rect x='0' y='87' width='10' height='10' fill='#1F8A4C'/><text x='14' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Green: within normal</text><rect x='156.2' y='87' width='10' height='10' fill='#B7791F'/><text x='170.2' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Amber: off normal</text><rect x='293.77' y='87' width='10' height='10' fill='#B83A2E'/><text x='307.77' y='96' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1B2420'>Red: far off normal</text><line x1='376.9' y1='120' x2='376.9' y2='504' stroke='#B7791F' stroke-dasharray='3 3'/><text x='376.9' y='116' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B7791F'>Amber +20%</text><line x1='498.2' y1='120' x2='498.2' y2='504' stroke='#B83A2E' stroke-dasharray='3 3'/><text x='498.2' y='116' text-anchor='middle' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif' font-size='10.5' fill='#B8